[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kvcachescope"
version = "0.1.0"
description = "Logical memory profiler, fragmentation analyzer, and failure defense system for PagedAttention engines (vLLM, SGLang)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Brian Munene" }
]
keywords = [
    "llm", "vllm", "pagedattention", "kv-cache", "cuda", "profiler", "deep-learning", "sglang"
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
    "websockets>=11.0"
]

[project.optional-dependencies]
vllm = [
    "vllm>=0.4.0",
    "torch>=2.1.0"
]
dev = [
    "pytest>=7.0",
    "psutil>=5.9.0",
    "playwright>=1.40.0"
]

[project.scripts]
kvcachescope = "backend.ci_runner:main"

[project.urls]
Homepage = "https://github.com/brian-mwirigi/kvcachescope"
Repository = "https://github.com/brian-mwirigi/kvcachescope"
"Bug Tracker" = "https://github.com/brian-mwirigi/kvcachescope/issues"
